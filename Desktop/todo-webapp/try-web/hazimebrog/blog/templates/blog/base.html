{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>todapp</title>
    <link rel="icon" href="{% static 'favicon.ico/favicon.png' %}" type="image/png">
    <link rel="stylesheet" type= "text/css" href="{% static 'css/blog.css' %}">
  </head>
  <header>
   
  {% if request.user.is_authenticated %}
  <a class="rogin-name">ログイン中 : {{ user.username }}</a>
  {% endif %}
    <nav>
      <img src="{% static 'favicon.ico/favicon.png' %}" width="70" height="70">
        <ul>
          
          <a class="front" href="{% url 'frontpage' %}">確認</a>
          <a class="front" href="{% url 'create_post' %}">タスク追加</a>
          {% if request.user.is_authenticated %}
          <a class="header-account" href="{% url 'accounts:logout' %}">ログアウト</a>
          <a class="header-account" href="{% url 'accounts:delete_account' %}">退会する</a>
          {% else %}
          <a href="{% url 'accounts:login' %}" class="header-account">ログイン</a>
          <a href="{% url 'accounts:signup' %}" class="header-account">会員登録</a>
          {% endif %}
        </ul>
    </nav>    
  </header>
        <div class="containar">{% block content %} {% endblock %}</div>
    </section>
</html>
