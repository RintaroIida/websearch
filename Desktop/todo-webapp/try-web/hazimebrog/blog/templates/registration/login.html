{% extends "blog/base.html" %}

{% block content %}
<h1>ログイン</h1>
<form method="post" class="p-4 m-4 bg-light border border-success rounded">
    {% csrf_token %}
    
    {% if form.errors %}
        <div class="alert alert-danger">
            <ul>
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    
    <div class="sign-form">
        <label class="sign" for="username">メールアドレス</label>
        <input type="email" id="username" name="username" class="form-control" value="{{ form.username.value }}">
    </div>
    
    <div class="sign-form">
        <label class="sign" for="password">パスワード</label>
        <input type="password" id="password" name="password" class="form-control">
    </div>
    
    <button type="submit" class="btn btn-success mt-4">ログインする</button>
</form>
{% endblock %}
